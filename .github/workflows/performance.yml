# Performance tier — scheduled, not per-PR (docs/TEST_STRATEGY.md section 8).
# Perf numbers are provisional for the Python-only build (ADR-006) and must be
# re-benchmarked on a representative host, not assumed. On synthetic data only
# (ADR-005). Until the gateway/endpoints exist, the perf tests skip cleanly, so
# this workflow is wired end-to-end from day one.
name: Performance

on:
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install deps (dev + perf extras)
        run: uv sync --extra dev --extra perf

      # TODO(Phase 3+): stand up the stack (docker compose up -d) and export
      # HIP_PERF_TARGET so the perf assertions run instead of skipping.
      - name: pytest (performance tier)
        run: uv run pytest -m performance -ra
