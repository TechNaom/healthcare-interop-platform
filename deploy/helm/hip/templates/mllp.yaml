{{- if .Values.mllp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-mllp" (include "hip.fullname" .) }}
  labels:
    {{- include "hip.labels" . | nindent 4 }}
    app.kubernetes.io/component: mllp
spec:
  replicas: {{ .Values.mllp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mllp
  template:
    metadata:
      labels:
        {{- include "hip.labels" . | nindent 8 }}
        app.kubernetes.io/component: mllp
    spec:
      serviceAccountName: {{ include "hip.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mllp
          image: {{ include "hip.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "hip.messaging.hl7.listener"]
          ports:
            - name: mllp
              containerPort: {{ .Values.mllp.port }}
          env:
            {{- include "hip.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.mllp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-mllp" (include "hip.fullname" .) }}
  labels:
    {{- include "hip.labels" . | nindent 4 }}
    app.kubernetes.io/component: mllp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mllp
  ports:
    - name: mllp
      port: {{ .Values.mllp.port }}
      targetPort: mllp
{{- end }}
