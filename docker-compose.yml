# Local/pilot orchestration — the whole self-hosted stack, one command (ADR-003).
# Nothing here depends on a cloud provider. All secrets come from .env (copy
# .env.example -> .env, or run scripts/demo.sh which generates them); real values
# never live in this file or the repo.
#
# The `app` service runs Alembic migrations then serves the FHIR gateway; `mllp`
# runs the HL7 v2 ingestion listener. keycloak/vault are wired (JWKS auth,
# Vault-sourced encryption/blind-index keys) but off by default — bring them up
# with `docker compose --profile infra -f docker-compose.yml -f
# docker-compose.infra.yml up` (see that file for prerequisites). Without the
# override, auth/encryption keep using env-provided secrets. minio is declared
# for the full self-hosted architecture (object store) but has no consumer yet
# — no phase needs blob storage.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hip}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hip}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # keycloak/vault/minio are the full self-hosted architecture. keycloak/vault
  # are wired via docker-compose.infra.yml (see top-of-file comment); minio has
  # no consumer yet. They're behind the "infra" profile so the default
  # `docker compose up` brings up only the working core (db + app + mllp).
  # Add them with: docker compose --profile infra up
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["infra"]
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "8080:8080"

  vault:
    image: hashicorp/vault:1.18
    profiles: ["infra"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?set VAULT_DEV_ROOT_TOKEN in .env}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"

  minio:
    image: minio/minio:latest
    profiles: ["infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hip}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      HIP_ENV: local
      HIP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hip}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-hip}
      HIP_ENCRYPTION_KEY: ${HIP_ENCRYPTION_KEY:-}
      HIP_BLIND_INDEX_KEY: ${HIP_BLIND_INDEX_KEY:-}
      HIP_JWT_SECRET: ${HIP_JWT_SECRET:-}
      HIP_VAULT_ADDR: ${HIP_VAULT_ADDR:-}
      HIP_VAULT_TOKEN: ${HIP_VAULT_TOKEN:-}
      HIP_JWT_JWKS_URL: ${HIP_JWT_JWKS_URL:-}
    command: ["sh", "-c", "alembic upgrade head && uvicorn hip.gateway.app:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mllp:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy # app runs the migrations the listener needs
    environment:
      HIP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hip}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-hip}
      HIP_ENCRYPTION_KEY: ${HIP_ENCRYPTION_KEY:-}
      HIP_BLIND_INDEX_KEY: ${HIP_BLIND_INDEX_KEY:-}
      HIP_VAULT_ADDR: ${HIP_VAULT_ADDR:-}
      HIP_VAULT_TOKEN: ${HIP_VAULT_TOKEN:-}
    command: ["python", "-m", "hip.messaging.hl7.listener"]
    ports:
      - "2575:2575"

volumes:
  db_data:
  minio_data:
