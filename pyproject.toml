[project]
name = "hip"
version = "0.0.0"
description = "HIPAA-aligned HL7 v2 + FHIR (R4/R5) interoperability platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }

# Runtime dependencies are intentionally empty at Phase 0 — the scaffold imports
# only stdlib. Each layer's real dependencies (fastapi, fhir.resources,
# sqlalchemy, python-hl7, structlog, ...) get added in the phase that builds it,
# so the lockfile grows with actual usage rather than speculatively.
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hip"]

# --- ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Conservative starting set; tighten per-phase as real code lands.
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

# --- mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true

# --- pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

# --- coverage -----------------------------------------------------------
[tool.coverage.run]
source = ["src/hip"]
branch = true

# --- bandit -------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests"]
