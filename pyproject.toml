[project]
name = "hip"
version = "0.0.0"
description = "HIPAA-aligned HL7 v2 + FHIR (R4/R5) interoperability platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }

# Runtime deps grow with each layer, not speculatively (docs/TECH_STACK.md).
# Phase 1 adds the Gateway (FastAPI) and the canonical model (Pydantic v2).
# Still to come per phase: fhir.resources, python-hl7, sqlalchemy, structlog, ...
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    "hl7>=0.4",  # HL7 v2 parsing (docs/TECH_STACK.md); MLLP framing is hand-rolled
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "httpx>=0.27",
]
# Performance/load tooling — kept out of the default dev set so a normal
# `uv sync --extra dev` stays fast. Install with `uv sync --extra perf` in the
# scheduled performance job (see .github/workflows/performance.yml).
perf = [
    "locust>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hip"]

# --- ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Conservative starting set; tighten per-phase as real code lands.
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "PL"]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point in tests. PLR2004: literal comparisons are fine.
# PLC0415: local imports in tests are deliberate (e.g. proving a module resolves).
"tests/**" = ["S101", "PLR2004", "PLC0415"]

# --- mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true

# python-hl7 ships no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = "hl7.*"
ignore_missing_imports = true

# --- pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# import-mode=importlib lets the tiered tests/ subdirs work without __init__.py
# and avoids duplicate-basename import clashes across tiers.
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["src"]
filterwarnings = [
    # Starlette's TestClient warns about httpx; not actionable for us and just noise.
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore::DeprecationWarning:starlette.testclient",
]
markers = [
    "unit: fast, in-process, no external I/O. Runs on every push/PR.",
    "integration: exercises 2+ components against real containers (testcontainers). Every PR.",
    "e2e: full stack over real transports via Compose. Every PR (slower).",
    "regression: locks previously-shipped behavior against silent change. Every PR + release.",
    "performance: throughput/latency vs SRS 7.1 targets (locust/benchmarks). Scheduled, not per-PR.",
    "uat: user-acceptance scenarios from docs/UAT_PLAN.md. Release-candidate gate.",
    "compliance: HIPAA claims (audit, de-id, no-PHI-in-logs, RBAC). Every PR once applicable.",
    "slow: long-running; opt-in locally.",
]

# --- coverage -----------------------------------------------------------
[tool.coverage.run]
source = ["src/hip"]
branch = true

# --- bandit -------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests"]
